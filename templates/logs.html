<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Logs - CMLMonitor</title>
    <link rel="stylesheet" href="static/css/bootstrap5.3.0.min.css">
    <link rel="stylesheet" href="static/css/all6.4.0.min.css">
    <link rel="stylesheet" href="static/css/home.css">
    <style>
        .log-terminal {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
            height: calc(100vh - 180px);
            overflow-y: auto;
            border-radius: 8px;
            padding: 15px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .btn-scroll-bottom {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 123, 255, 0.8);
            color: white;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s ease-in-out;
            z-index: 1000;
        }

        .btn-scroll-bottom:hover {
            background-color: rgba(0, 86, 179, 1);
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg fixed-top bg-white border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="fa-solid fa-arrow-left me-2 small text-secondary" title="Back to Dashboard"></i>
                CML <span>MONITOR</span>
            </a>

            <ul class="navbar-nav me-auto ms-4 mb-2 mb-lg-0">
                {% if user.is_admin %}
                <li class="nav-item"><a class="nav-link" href="/runtimes">Runtimes</a></li>
                <li class="nav-item"><a class="nav-link" href="/jobs">Jobs</a></li>
                {% endif %}
            </ul>

            <div class="d-flex align-items-center">
                {% if user.config_admin %}
                    <a href="/config" class="text-secondary me-4 text-decoration-none" title="Configuration">
                        <i class="fa-solid fa-gear" style="font-size: 1.25rem;"></i>
                    </a>
                {% endif %}
                
                <div class="nav-item dropdown user-dropdown-hover">
                    <div class="d-flex align-items-center user-dropdown-trigger" data-bs-toggle="dropdown">
                        <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center me-2" style="width: 36px; height: 36px; font-weight: 600;">
                            {{ user.username[:1]|upper }}
                        </div>
                        <span class="text-dark fw-semibold">{{ user.username }}</span>
                        <i class="fa-solid fa-chevron-down ms-2 small text-muted"></i>
                    </div>

                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
                        <li class="px-3 py-2 border-bottom user-details-box">
                            <div class="fw-bold text-dark">{{ user.fullname }}</div>
                            <div class="text-muted small"><i class="fa-solid fa-user me-1"></i>{{ user.username }}</div>
                        </li>
                        <li>
                            <a class="dropdown-item text-danger d-flex align-items-center mt-1" href="/logout">
                                <i class="fa-solid fa-right-from-bracket me-2"></i> Logout
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0">Application Logs</h2>
            <a href="/api/logs/download" class="btn btn-outline-primary btn-sm d-flex align-items-center fw-semibold">
                <i class="fa-solid fa-download me-2"></i> Download Logs
            </a>
        </div>

        <div class="position-relative">
            <div id="logContainer" class="log-terminal"></div>
            
            <button id="btnScrollBottom" class="btn-scroll-bottom position-absolute bottom-0 end-0 m-4 d-none" onclick="scrollToBottom()" title="Scroll to Bottom">
                <i class="fa-solid fa-arrow-down fs-5"></i>
            </button>
        </div>
    </div>

    <script src="static/js/bootstrap5.3.0.bundle.min.js"></script>
    <script>
        let logOffset = 0;
        let autoScroll = true;
        const logContainer = document.getElementById('logContainer');
        const scrollBtn = document.getElementById('btnScrollBottom');

        // Fetch logs using the byte offset
        async function fetchLogs() {
            try {
                const response = await fetch(`/api/logs/stream?offset=${logOffset}`);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                
                if (data.logs) {
                    logContainer.textContent += data.logs;
                    if (autoScroll) {
                        scrollToBottom();
                    }
                }
                
                if (data.offset !== undefined) {
                    logOffset = data.offset;
                }
            } catch (error) {
                console.error("Failed to fetch logs:", error);
            }
        }

        function scrollToBottom() {
            logContainer.scrollTop = logContainer.scrollHeight;
            autoScroll = true;
            scrollBtn.classList.add('d-none');
        }

        // Detect if the user manually scrolled up
        logContainer.addEventListener('scroll', () => {
            // A small 10px buffer to account for sub-pixel rendering limits
            const isAtBottom = logContainer.scrollHeight - logContainer.scrollTop <= logContainer.clientHeight + 10;
            
            if (!isAtBottom) {
                autoScroll = false;
                scrollBtn.classList.remove('d-none');
            } else {
                autoScroll = true;
                scrollBtn.classList.add('d-none');
            }
        });

        // Initialize fetching on a 1-second interval
        document.addEventListener('DOMContentLoaded', () => {
            fetchLogs();
            setInterval(fetchLogs, 1000);
        });
    </script>
</body>
</html>
