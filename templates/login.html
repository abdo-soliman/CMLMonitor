<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - CMLmonitor</title>
    <link rel="stylesheet" href="static/css/bootstrap5.3.0.min.css">
    <link rel="stylesheet" href="static/css/all6.4.0.min.css">
    <link rel="stylesheet" href="static/css/login.css">
</head>
<body>
    <div class="login-card">
        <h3 class="text-center mb-4"><span style="color: #007bff !important;">CML</span> MONITOR</h3>
        
        <!-- Flash Message Container -->
        <div id="flash-container">
            {% if error %}
                <div class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endif %}
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show mb-4" role="alert">
                            {% if category == 'error' %}
                                <i class="fa-solid fa-circle-exclamation me-2"></i>
                            {% else %}
                                <i class="fa-solid fa-circle-check me-2"></i>
                            {% endif %}
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <form method="POST">
            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>

    <script src="static/js/bootstrap5.3.0.bundle.min.js"></script>
    <script>
        // Auto dismiss alerts after 5 seconds to match the rest of the application
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const alerts = document.querySelectorAll('.alert');
                alerts.forEach(function(alertDiv) {
                    alertDiv.classList.remove('show');
                    setTimeout(() => alertDiv.remove(), 150); // Wait for Bootstrap fade transition
                });
            }, 5000);
        });
    </script>
</body>
</html>
