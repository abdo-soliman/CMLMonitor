<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - CMLmonitor</title>
    <link rel="stylesheet" href="static/css/bootstrap5.3.0.min.css">
    <link rel="stylesheet" href="static/css/all6.4.0.min.css">
    <link rel="stylesheet" href="static/css/login.css">
</head>

<body>
    <div class="login-card">
        <h3 class="text-center mb-4"><span style="color: #007bff !important;">CML</span> MONITOR</h3>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show mb-4" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>

    <script src="static/js/bootstrap5.3.0.bundle.min.js"></script>
</body>
</html>
